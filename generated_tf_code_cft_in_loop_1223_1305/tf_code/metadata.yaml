apiVersion: blueprints.cloud.google.com/v1alpha1
kind: TerraformBlueprint
metadata:
  name: terraform-google-private-service-connect
  source:
    type: git
    git:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
      dir: /
  version: 1.0.0
spec:
  info:
    title: Private Service Connect (PSC)
    actuationTool:
      type: Terraform
      versions: [ ">= 1.3" ]
    description:
      tagline: A comprehensive module for creating and managing Google Cloud Private Service Connect resources.
      detailed: This module simplifies the creation of Private Service Connect (PSC) resources on Google Cloud. It supports three primary use cases: creating a consumer endpoint to connect to Google APIs, creating a consumer endpoint to connect to a published service, and publishing a service for consumers via a service attachment.
    documentations:
      - title: Private Service Connect Documentation
        url: https://cloud.google.com/vpc/docs/private-service-connect
  customization:
    variables:
      - name: psc_type
        description: "The type of PSC resource to create. Must be one of: `google_apis`, `consumer`, `producer`."
        type: string
        required: true
      - name: name
        description: "The name for the PSC resource (endpoint or service attachment)."
        type: string
        required: true
      - name: project_id
        description: "The project ID where the PSC resource will be created."
        type: string
        required: true
      - name: region
        description: "The region where the PSC resource will be created."
        type: string
        required: true
      - name: network
        description: "The self-link of the VPC network for the PSC resource."
        type: string
        required: true
      - name: description
        description: "An optional description for the PSC resource."
        type: string
        required: false
        default: null
      - name: subnetwork
        description: "The self-link of the subnetwork for the consumer endpoint's IP address. Required when psc_type is `google_apis` or `consumer`."
        type: string
        required: false
        default: null
      - name: service_attachment_uri
        description: "The URI of the producer's service attachment to connect to. Required when psc_type is `consumer`."
        type: string
        required: false
        default: null
      - name: google_apis_bundle
        description: "The Google APIs bundle to connect to. Must be `all-apis` or `vpc-sc`. Only applicable when psc_type is `google_apis`."
        type: string
        required: false
        default: "all-apis"
      - name: global_access
        description: "Whether to allow PSC global access for Google APIs endpoint. Only applicable when psc_type is `google_apis`."
        type: bool
        required: false
        default: true
      - name: psc_nat_subnet_cidr
        description: "The CIDR range for the PSC NAT subnet, which will be created automatically. Required when psc_type is `producer`."
        type: string
        required: false
        default: null
      - name: producer_ilb_forwarding_rule
        description: "The self-link of the Internal Load Balancer's forwarding rule to publish. Required when psc_type is `producer`."
        type: string
        required: false
        default: null
      - name: connection_preference
        description: "The connection preference for the service attachment. Can be `ACCEPT_AUTOMATIC` or `ACCEPT_MANUAL`. Only applicable when psc_type is `producer`."
        type: string
        required: false
        default: "ACCEPT_AUTOMATIC"
      - name: enable_proxy_protocol
        description: "If true, enable the proxy protocol (version 1) to be used with this service attachment. Only applicable when psc_type is `producer`."
        type: bool
        required: false
        default: true
    variableGroups:
      - name: "General Settings"
        description: "Basic configuration for all PSC resources."
        variables:
          - psc_type
          - name
          - project_id
          - region
          - network
          - description
      - name: "Consumer Endpoint (Published Service)"
        description: "Settings required when connecting to a 3rd party or internal published service (psc_type = 'consumer')."
        variables:
          - subnetwork
          - service_attachment_uri
      - name: "Consumer Endpoint (Google APIs)"
        description: "Settings required when connecting to Google APIs (psc_type = 'google_apis')."
        variables:
          - subnetwork
          - google_apis_bundle
          - global_access
      - name: "Producer Service Attachment"
        description: "Settings required when publishing a service (psc_type = 'producer')."
        variables:
          - psc_nat_subnet_cidr
          - producer_ilb_forwarding_rule
          - connection_preference
          - enable_proxy_protocol
    outputs:
      - name: endpoint_forwarding_rule_id
        description: "The resource ID of the created PSC endpoint forwarding rule. This will be null if psc_type is 'producer' or if the endpoint is not created."
      - name: endpoint_ip_address
        description: "The IP address of the created PSC endpoint. This will be null if psc_type is 'producer' or if the endpoint is not created."
      - name: psc_nat_subnet_id
        description: "The resource ID of the created PSC NAT subnet. This will be null if psc_type is 'consumer' or 'google_apis' or if the subnet is not created."
      - name: service_attachment_id
        description: "The resource ID of the created service attachment. This will be null if psc_type is 'consumer' or 'google_apis' or if the service attachment is not created."
  requirements:
    roles:
      - level: project
        role: roles/compute.networkAdmin
    services:
      - compute.googleapis.com
