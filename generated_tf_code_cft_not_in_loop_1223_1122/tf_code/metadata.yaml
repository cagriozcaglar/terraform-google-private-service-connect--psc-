apiVersion: blueprints.cloud.google.com/v1alpha1
kind: TerraformBlueprint
metadata:
  name: terraform-google-private-service-connect
  source:
    # This is a placeholder source. Replace with the actual repository URL.
    repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
    sourceType: git
  # This is a placeholder version. Replace with the actual module version.
  version: 1.0.0
spec:
  info:
    title: Private Service Connect (PSC) Module
    actuationTool:
      actuationToolType: Terraform
      versions:
      - '>= 1.0'
    descriptions:
      tagline: A flexible module to create and manage Private Service Connect resources on Google Cloud.
      detailed: This module supports three primary use cases for Private Service Connect (PSC), controlled by the `psc_type` variable. It can create a Service Attachment for service producers, a PSC endpoint (forwarding rule) for service consumers to connect to a published service, or a PSC endpoint for private access to Google APIs.
    # Placeholder for examples. Add actual examples from the module.
    examples:
    - name: psc_producer_example
      location:
        repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
        sourceType: git
        subdir: examples/producer
      title: PSC Producer Example
    - name: psc_consumer_service_example
      location:
        repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
        sourceType: git
        subdir: examples/consumer_service
      title: PSC Consumer to Service Example
    - name: psc_consumer_google_apis_example
      location:
        repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
        sourceType: git
        subdir: examples/consumer_google_apis
      title: PSC Consumer to Google APIs Example
    labels:
      - gcp
      - networking
      - psc
  customization:
    variables:
    - name: psc_type
      description: The type of PSC resource to create. If null, no resource will be created. Must be one of 'PRODUCER', 'CONSUMER_SERVICE', 'CONSUMER_GOOGLE_APIS'.
      type: string
      default: null
      required: false
    - name: project_id
      description: The project ID where the Private Service Connect resource will be created. Required when `psc_type` is not null.
      type: string
      default: null
      required: false
    - name: region
      description: The region where the Private Service Connect resource will be created. Required when `psc_type` is not null.
      type: string
      default: null
      required: false
    - name: name
      description: The name for the Private Service Connect resource (Service Attachment or Forwarding Rule). Required when `psc_type` is not null.
      type: string
      default: null
      required: false
    - name: description
      description: An optional description for the PSC resource.
      type: string
      default: null
      required: false
    - name: target_service
      description: 'PRODUCER only. The full self-link or ID of the internal load balancer''s forwarding rule that fronts the service.'
      type: string
      default: null
      required: false
    - name: nat_subnets
      description: 'PRODUCER only. A list of self-links for the PSC NAT subnets. These subnets are used to source NAT traffic from consumers.'
      type: list(string)
      default: []
      required: false
    - name: enable_proxy_protocol
      description: 'PRODUCER only. If true, the PROXY protocol header is enabled.'
      type: boolean
      default: false
      required: false
    - name: connection_preference
      description: 'PRODUCER only. The connection preference for the service attachment. Valid values are ''ACCEPT_AUTOMATIC'' or ''ACCEPT_MANUAL''.'
      type: string
      default: ACCEPT_MANUAL
      required: false
    - name: reconcile_connections
      description: 'PRODUCER only. If true, connections that are not explicitly accepted are rejected.'
      type: boolean
      default: true
      required: false
    - name: consumer_reject_list
      description: 'PRODUCER only. A list of project IDs or numbers that are not allowed to connect to this service attachment.'
      type: list(string)
      default: []
      required: false
    - name: consumer_accept_list
      description: 'PRODUCER only. A list of projects that are allowed to connect to this service attachment.'
      type: list(object)
      default: []
      required: false
    - name: network
      description: 'CONSUMER only. The self-link of the consumer''s VPC network where the PSC endpoint will be created.'
      type: string
      default: null
      required: false
    - name: subnetwork
      description: 'CONSUMER only. The self-link of the subnetwork where the endpoint''s IP address will be allocated.'
      type: string
      default: null
      required: false
    - name: ip_address
      description: 'CONSUMER only. An optional static internal IP address for the PSC endpoint. If not provided, an ephemeral address from the subnetwork is allocated.'
      type: string
      default: null
      required: false
    - name: target_service_attachment
      description: 'CONSUMER_SERVICE only. The full resource URI of the producer''s service attachment to connect to.'
      type: string
      default: null
      required: false
    - name: allow_psc_global_access
      description: 'CONSUMER_SERVICE only. If true, allows the PSC endpoint to be accessed from all regions.'
      type: boolean
      default: false
      required: false
    variableGroups:
    - name: General Settings
      description: Basic configuration for the Private Service Connect resource.
      variables:
      - psc_type
      - project_id
      - region
      - name
      - description
    - name: Producer Settings
      description: Configuration for creating a PSC Service Attachment (psc_type = PRODUCER).
      variables:
      - target_service
      - nat_subnets
      - enable_proxy_protocol
      - connection_preference
      - reconcile_connections
      - consumer_reject_list
      - consumer_accept_list
    - name: Consumer Settings
      description: Configuration for creating a PSC Endpoint (psc_type starts with CONSUMER).
      variables:
      - network
      - subnetwork
      - ip_address
      - target_service_attachment
      - allow_psc_global_access
    outputs:
    - name: id
      description: The ID of the created Private Service Connect resource.
    - name: self_link
      description: The self-link of the created Private Service Connect resource. For producers, this is the service attachment URI to be shared with consumers.
    - name: ip_address
      description: The internal IP address of the created consumer PSC endpoint. This will be null if `psc_type` is 'PRODUCER' or if no resource is created.
    - name: service_attachment
      description: The created `google_compute_service_attachment` resource object for producers. This will be null if `psc_type` is not 'PRODUCER' or if no resource is created.
    - name: forwarding_rule
      description: The created `google_compute_forwarding_rule` resource object for consumer endpoints. This will be null if `psc_type` is 'PRODUCER' or if no resource is created.
  requirements:
    # Roles and permissions required to deploy the module.
    roles:
    - level: project
      role: roles/compute.networkAdmin
    permissions:
    - compute.serviceAttachments.create
    - compute.forwardingRules.create
    - compute.subnetworks.use
    - compute.networks.use
    services:
    - compute.googleapis.com
