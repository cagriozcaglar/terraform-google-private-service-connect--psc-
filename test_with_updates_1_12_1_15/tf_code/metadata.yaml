apiVersion: blueprints.cloud.google.com/v1alpha1
kind: TerraformBlueprint
metadata:
  name: terraform-google-private-service-connect
  source:
    type: git
    git:
      repo: https://github.com/GoogleCloudPlatform/terraform-google-private-service-connect.git
      # A pseudo-directory is used as there isn't a real subdirectory in the provided code.
      dir: /
  version: 1.0.0
  actuationTool:
    type: Terraform
    versions:
    - ">= 1.3.0"
  title: Private Service Connect (PSC) Module
  descriptions:
    tagline: A flexible module for creating producer service attachments and consumer endpoints.
    detailed: This module simplifies the creation of Private Service Connect (PSC) resources in Google Cloud. It can be configured to operate in either PRODUCER mode, creating a service attachment to expose a service, or CONSUMER mode, creating a forwarding rule to consume a service.
  labels:
    gcp: ""
    networking: ""
    psc: ""
spec:
  requirements:
    roles:
    - level: Project
      role: roles/compute.networkAdmin
    services:
    - compute.googleapis.com
  customization:
    variables:
    - name: name
      description: The base name for the Private Service Connect resources being created.
      type: string
      required: true
    - name: project_id
      description: The project ID where the PSC resources will be created.
      type: string
      required: true
    - name: region
      description: The region where the PSC resources will be created.
      type: string
      required: true
    - name: network
      description: The self-link of the VPC network where the PSC resources will
        be created.
      type: string
      required: true
    - name: psc_type
      description: The type of PSC configuration to create. Must be either 'PRODUCER'
        or 'CONSUMER'.
      type: string
      required: true
    - name: description
      description: An optional description to apply to the created PSC resources
        (service attachment or forwarding rule).
      type: string
      default: Private Service Connect resource.
      required: false
    - name: target_service
      description: (Producer-only) The self-link of the internal load balancer's
        forwarding rule to be exposed by the service attachment.
      type: string
      required: true
    - name: connection_preference
      description: (Producer-only) The connection preference for the service attachment.
        'ACCEPT_AUTOMATIC' accepts all connections. 'ACCEPT_MANUAL' requires connections
        to be explicitly approved.
      type: string
      default: ACCEPT_AUTOMATIC
      required: false
    - name: enable_proxy_protocol
      description: (Producer-only) If true, the PROXY protocol header will be sent
        to backend instances.
      type: bool
      default: true
      required: false
    - name: create_psc_nat_subnet
      description: (Producer-only) If true, a new subnet with purpose PRIVATE_SERVICE_CONNECT
        will be created. If false, you must provide existing subnets in 'psc_nat_subnets'.
      type: bool
      default: true
      required: false
    - name: psc_nat_subnet_cidr
      description: (Producer-only) The CIDR range for the PSC NAT subnet to be created.
        Required if 'create_psc_nat_subnet' is true.
      type: string
      required: true
    - name: psc_nat_subnets
      description: (Producer-only) A list of self-links of existing subnets to use
        for PSC NAT. Required if 'create_psc_nat_subnet' is false.
      type: list(string)
      default: []
      required: false
    - name: consumer_accept_lists
      description: (Producer-only) A list of consumer projects that are allowed
        to connect to the service attachment. Each object in the list should have
        'project_id_or_num' and 'connection_limit'.
      type: list(object({ project_id_or_num = string, connection_limit = number }))
      default: []
      required: false
    - name: target_service_attachment
      description: (Consumer-only) The self-link of the service attachment to connect
        to. For Google APIs, use special values like 'all-apis' or 'vpc-sc'.
      type: string
      required: true
    - name: create_psc_endpoint_ip
      description: (Consumer-only) If true, a new static internal IP address will
        be created for the PSC endpoint. If false, provide an existing IP in 'psc_endpoint_ip_address'.
      type: bool
      default: true
      required: false
    - name: psc_endpoint_ip_address
      description: (Consumer-only) An existing static internal IP address to use
        for the PSC endpoint. Required if 'create_psc_endpoint_ip' is false.
      type: string
      required: true
    - name: psc_endpoint_subnet
      description: (Consumer-only) The self-link of the subnet where the PSC endpoint
        and its IP address will be created.
      type: string
      required: true
    - name: allow_global_access
      description: (Consumer-only) If true, allows the PSC endpoint to be accessed
        from any region within the VPC. Useful for connecting to Google APIs.
      type: bool
      default: false
      required: false
    - name: consumer_load_balancing_scheme
      description: (Consumer-only) The load balancing scheme for the consumer forwarding
        rule. Should be 'INTERNAL' for connecting to published services and null
        for connecting to Google APIs.
      type: string
      default: INTERNAL
      required: false
    variableGroups:
    - name: General Settings
      description: Basic configuration for all PSC resources.
      variables:
      - name
      - project_id
      - region
      - network
      - psc_type
      - description
    - name: Producer Settings
      description: Variables for creating a producer-side Service Attachment.
      variables:
      - target_service
      - connection_preference
      - enable_proxy_protocol
      - create_psc_nat_subnet
      - psc_nat_subnet_cidr
      - psc_nat_subnets
      - consumer_accept_lists
    - name: Consumer Settings
      description: Variables for creating a consumer-side Endpoint.
      variables:
      - target_service_attachment
      - create_psc_endpoint_ip
      - psc_endpoint_ip_address
      - psc_endpoint_subnet
      - allow_global_access
      - consumer_load_balancing_scheme
    outputs:
    - name: service_attachment
      description: The created Google Compute Service Attachment resource. This will
        be null if psc_type is 'CONSUMER'.
    - name: psc_endpoint
      description: The created Google Compute Forwarding Rule resource, which acts
        as the PSC endpoint. This will be null if psc_type is 'PRODUCER'.
    - name: psc_endpoint_ip_address
      description: The internal IP address of the created PSC endpoint. This will
        be null if psc_type is 'PRODUCER'.
    - name: psc_nat_subnet
      description: The created PSC NAT subnet for the service attachment. This will
        be null if psc_type is 'CONSUMER' or if an existing subnet was used.
